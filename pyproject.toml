[project]
name = "payment-processing-service"
version = "0.1.0"
description = "Async payment processing service with FastAPI, RabbitMQ and PostgreSQL"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.122.0",
    "uvicorn[standard]>=0.38.0",
    "sqlalchemy>=2.0.44",
    "asyncpg>=0.31.0",
    "alembic>=1.17.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "faststream>=0.7.1",
    "aio-pika>=9.6.2",
    "python-multipart>=0.0.20",
    "colorlog>=6.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.27.0",
    "pre-commit>=4.6.2",
    "ruff>=0.15.20",
    "mypy>=1.19.1",
    "types-aiofiles>=25.1.0.20260518",
    "aiosqlite>=0.22.1",
    "psycopg2-binary>=2.9.12",
]

[tool.poetry]
packages = [{ include = "src" }]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "alembic", "migrations", "dist", "media"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "skip"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/", "scripts/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
